version: 2

release:
  mode: replace

builds:
  - id: trc
    main: .
    binary: trc
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - trc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: trc
    homepage: https://github.com/mickamy/trc
    description: A local request tracer for Docker microservices.
    directory: Formula
    repository:
      owner: mickamy
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

dockers_v2:
  - id: trcd
    ids: []
    dockerfile: Dockerfile
    images:
      - "ghcr.io/mickamy/trcd"
    tags:
      - "v{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
    build_args:
      VERSION: "{{ .Version }}"

changelog: {}
