services:
  gateway:
    build: ./gateway
    networks: [app]
    ports: ["8080:8080"]
    environment:
      USERS_URL: "http://users:8080"
      ORDERS_URL: "http://orders:8080"
      AUTH_ADDR: "auth:50051"

  users:
    build: ./users
    networks: [app]

  orders:
    build: ./orders
    networks: [app]
    environment:
      USERS_URL: "http://users:8080"

  auth:
    build: ./auth
    networks: [app]

  client:
    build: ./client
    networks: [app]
    depends_on: [gateway]
    environment:
      GATEWAY_URL: "http://gateway:8080"

networks:
  app:
